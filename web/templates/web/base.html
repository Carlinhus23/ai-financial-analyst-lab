<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}AI Financial Analyst{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.classless.min.css">
  <style>
    td { text-align: right; font-variant-numeric: tabular-nums; }
    .tabla { overflow-x: auto; }
    /* Comparar: la tabla tiene su propia zona de desplazamiento y, al moverse
       por ella, la fila de títulos (arriba) y la columna de empresas (a la
       izquierda) se quedan fijas. El fondo tapa lo que pasa por debajo. */
    .tabla-fija { max-height: 75vh; }
    .tabla-fija thead th { position: sticky; top: 0; z-index: 1; background: var(--pico-background-color); white-space: nowrap; box-shadow: inset 0 -2px var(--pico-muted-border-color); }
    .tabla-fija tbody th { position: sticky; left: 0; background: var(--pico-background-color); }
    .tabla-fija thead th:first-child { left: 0; z-index: 2; }
    /* Solo para variaciones (sesión, crecimiento): verde si sube, rojo si baja.
       Son los colores de Pico, así que también valen en modo oscuro. */
    .sube { color: var(--pico-ins-color); }
    .baja { color: var(--pico-del-color); }
    /* Cifras destacadas de la empresa: etiqueta pequeña encima, número grande. */
    .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .cifras div { display: flex; flex-direction: column; }
    .cifras small { color: var(--pico-muted-color); }
    .cifras strong { font-size: 1.75rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
    /* Título de cada bloque de ratios: en mayúsculas pequeñas, como un rótulo. */
    tr.grupo th { padding-top: 1.25rem; color: var(--pico-primary); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.06em; }
    /* Portada: tarjetas en rejilla que se adaptan al ancho de la pantalla. */
    .tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .tarjetas article { margin: 0; }
    .tarjetas header small:first-child { color: var(--pico-muted-color); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; }
    .tarjetas dl { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 1rem; margin: 0; }
    .tarjetas dt { font-weight: normal; color: var(--pico-muted-color); white-space: nowrap; }
    .tarjetas dd { margin: 0; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul><li><a href="{% url 'inicio' %}"><strong>AI Financial Analyst</strong></a></li></ul>
      <ul><li><a href="{% url 'comparar' %}">Comparar</a></li></ul>
    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  <footer><small>TFG · Universidad de Sevilla · Datos: SEC EDGAR (estados) y Yahoo Finance (cotización)</small></footer>
</body>
</html>
